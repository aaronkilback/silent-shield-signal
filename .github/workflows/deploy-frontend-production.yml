name: Frontend Production Deploy (Governed)

# Gate 6 — the governed one-click deploy. Runs in the `production` environment so the required
# reviewer (gate 2), main-branch restriction (gate 3), and env-scoped Cloudflare token (gate 4)
# gate it automatically. Records provenance (version.json + SHA + release receipt with the CF
# version ID) and verifies the SERVED artifact matches the deployed SHA — so "what code is in
# production right now" is answerable from a record, never by rebuilding and guessing.
#
# This is the path of least resistance: one dispatch + one approval, no local wrangler. Once the
# CF token is env-scoped (gate 4), it is the ONLY authenticated route to production.

on:
  workflow_dispatch:
    inputs:
      approved_commit_sha:
        description: Exact main commit SHA approved for production deploy.
        required: true
        type: string
      confirm_deploy:
        description: Type DEPLOY_FRONTEND_PRODUCTION to deploy.
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  deploy:
    name: Frontend Production Deploy
    runs-on: ubuntu-latest
    environment: production   # <- reviewer + branch policy + env-scoped secrets gate this job
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.confirm_deploy == 'DEPLOY_FRONTEND_PRODUCTION'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify approved main commit
        id: approved-source
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "${{ inputs.approved_commit_sha }}" ]; then
            echo "Approved SHA does not match checked-out main (approved=${{ inputs.approved_commit_sha }} head=$HEAD_SHA)."
            exit 1
          fi
          echo "source_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Determine if this deploy touches src/ (E2E requirement is conditional on it)
        id: srcdiff
        run: |
          set -uo pipefail
          # Baseline = the currently-LIVE deployed SHA (served version.json). First deploy has none → parent.
          BASE="$(curl -fsSL https://fortress.silentshieldsecurity.com/version.json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).source_commit_sha||"")}catch{console.log("")}})' || true)"
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"; fi
          if git diff --name-only "$BASE" "${{ steps.approved-source.outputs.source_sha }}" -- src/ | grep -q .; then
            echo "src_changed=true" >> "$GITHUB_OUTPUT"; echo "src/ changed since $BASE — Playwright E2E is REQUIRED"
          else
            echo "src_changed=false" >> "$GITHUB_OUTPUT"; echo "no src/ change since $BASE — Playwright E2E may be skipped"
          fi

      - name: Require exact CI success (E2E required only when src/ is touched)
        uses: actions/github-script@v7
        env:
          APPROVED_SHA: ${{ steps.approved-source.outputs.source_sha }}
          SRC_CHANGED: ${{ steps.srcdiff.outputs.src_changed }}
        with:
          script: |
            const requiredSuccess = [
              'TypeScript & Build', 'ESLint', 'Critical File Guard',
              'Shared Imports Consistency (_shared/*)',
              'Workstream D — confidence + provenance suite',
              'Workstream D — no autonomous execution on score',
              'Unit Tests (Vitest)', 'a1-guard',
            ];
            const sha = process.env.APPROVED_SHA;
            const srcChanged = process.env.SRC_CHANGED === 'true';
            const runs = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100,
            });
            const latestByName = new Map();
            for (const run of runs) {
              const e = latestByName.get(run.name);
              if (!e || Date.parse(run.started_at || run.created_at) > Date.parse(e.started_at || e.created_at)) latestByName.set(run.name, run);
            }
            const failures = [];
            for (const name of requiredSuccess) {
              const run = latestByName.get(name);
              if (!run) failures.push(`${name}: missing`);
              else if (run.status !== 'completed' || run.conclusion !== 'success') failures.push(`${name}: status=${run.status} conclusion=${run.conclusion}`);
            }
            // Playwright E2E: MUST be success when the deploy touches src/; may be skipped ONLY when it doesn't.
            // (Prevents an E2E that is skipped for some other reason on a real frontend change from sailing through.)
            const pw = latestByName.get('Playwright E2E');
            if (srcChanged) {
              if (!pw || pw.status !== 'completed' || pw.conclusion !== 'success')
                failures.push(`Playwright E2E: deploy touches src/ so it must be success, got ${pw ? pw.status + '/' + pw.conclusion : 'missing'}`);
            } else if (pw && pw.status === 'completed' && !['success', 'skipped'].includes(pw.conclusion)) {
              failures.push(`Playwright E2E: ${pw.conclusion}`);
            }
            if (failures.length) core.setFailed(`Deploy blocked by CI evidence for ${sha} (src_changed=${srcChanged}):\n${failures.join('\n')}`);
            else core.info(`CI evidence passed for ${sha} (src_changed=${srcChanged})`);

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Stamp served version.json (provenance)
        run: >-
          node scripts/release-control/frontend-release-control.mjs write-version
          --dist dist
          --source-sha "${{ steps.approved-source.outputs.source_sha }}"
          --run-id "${{ github.run_id }}"
          --target-route "fortress.silentshieldsecurity.com/*"
          --target-environment "production"

      - name: Assert Cloudflare token can write (fail fast, not mid-release)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "CLOUDFLARE_API_TOKEN not present in this environment."; exit 1; fi
          # Fail-fast token SHAPE check before the network call — turns a malformed stored secret
          # into a one-line diagnosis instead of a cryptic Cloudflare 9106/10000. Keys off the
          # cfut_ user-token prefix + no-whitespace. NOT a hardcoded length: CF token lengths vary
          # by type (legacy 40, cfut_ user token ~53). Provenance: 2026-08-29 — paste corruption
          # stored a whitespace-laden / doubled / truncated value and cost hours of 9106 hunting.
          case "$CLOUDFLARE_API_TOKEN" in
            *[[:space:]]*) echo "::error::CLOUDFLARE_API_TOKEN contains whitespace — stored secret is malformed (a valid token has none). Re-set the env secret from a clean copy."; exit 1 ;;
          esac
          case "$CLOUDFLARE_API_TOKEN" in
            cfut_*) : ;;
            *) echo "::error::CLOUDFLARE_API_TOKEN does not start with 'cfut_' (user API token prefix) — stored value is wrong/junk. If you intentionally switched token type, update this prefix check."; exit 1 ;;
          esac
          case "$CLOUDFLARE_API_TOKEN" in
            *[!A-Za-z0-9_-]*) echo "::warning::CLOUDFLARE_API_TOKEN has characters outside [A-Za-z0-9_-] — unusual for a CF token; proceeding, inspect if auth fails." ;;
          esac
          # Capture wrangler's ACTUAL output instead of discarding it to /dev/null and printing a
          # guess. GitHub Actions masks secret values in logs, so printing wrangler stderr is safe.
          set +e
          ASSERT_OUT="$(npx wrangler versions list --name silent-shield-signal 2>&1)"; rc=$?
          set -e
          echo "$ASSERT_OUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::Cloudflare token could not read the worker (wrangler exit $rc). Read the full wrangler output above literally: '[code: 10000]' / 'Authentication error' = bad or mistyped token VALUE; 'authorization' / 'not authorized' / 403 = missing Workers Scripts permission or wrong account/zone."
            exit 1
          fi
          echo "OK: token can read the worker."

      - name: Capture pre-deploy active version (rollback pointer for the receipt)
        id: predeploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          # `deployments status` (singular) = the CURRENT active deployment. `deployments list`
          # shows every historical deployment (all marked 100%) oldest-first, so head -1 there
          # returns the OLDEST version, not the live one — the pointer-capture bug fixed here.
          set +e
          DS_OUT="$(npx wrangler deployments status --name silent-shield-signal 2>&1)"; rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "::warning::deployments status failed (exit $rc) — rollback pointer will be 'none'. wrangler output:"; echo "$DS_OUT"; fi
          PREV="$(printf '%s' "$DS_OUT" | grep -oiE '\(100%\) [0-9a-f-]{36}' | grep -oiE '[0-9a-f-]{36}' | head -1)"
          if [ -z "$PREV" ]; then PREV="none"; fi
          echo "prev_version_id=$PREV" >> "$GITHUB_OUTPUT"
          echo "Pre-deploy active version (rollback pointer): $PREV"

      - name: Deploy worker + capture version ID
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          # Capture combined output but PRINT it before any failure exit — under set -e a failed
          # `OUT=$(... 2>&1)` aborts the step before echo, hiding the deploy error itself.
          set +e
          OUT="$(npx wrangler deploy --name silent-shield-signal 2>&1)"; rc=$?
          set -e
          echo "$OUT"
          if [ "$rc" -ne 0 ]; then echo "::error::wrangler deploy failed (exit $rc) — see full wrangler output above."; exit 1; fi
          VID="$(printf '%s' "$OUT" | grep -oiE 'Current Version ID: [0-9a-f-]+' | grep -oiE '[0-9a-f-]{36}' | head -1)"
          if [ -z "$VID" ]; then
            set +e; DSV_OUT="$(npx wrangler deployments status --name silent-shield-signal 2>&1)"; set -e
            echo "$DSV_OUT"
            VID="$(printf '%s' "$DSV_OUT" | grep -oiE '\(100%\) [0-9a-f-]{36}' | grep -oiE '[0-9a-f-]{36}' | head -1)"
          fi
          echo "version_id=$VID" >> "$GITHUB_OUTPUT"
          echo "Deployed CF version ID: $VID"

      - name: Served verification (fetch live /version.json, assert SHA)
        id: served
        run: |
          set -euo pipefail
          sleep 5
          SERVED_SHA="$(curl -fsSL https://fortress.silentshieldsecurity.com/version.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).source_commit_sha||"")}catch{console.log("")}})')"
          echo "served_sha=$SERVED_SHA"
          if [ "$SERVED_SHA" != "${{ steps.approved-source.outputs.source_sha }}" ]; then
            echo "SERVED VERIFICATION FAILED: live /version.json = '$SERVED_SHA', expected '${{ steps.approved-source.outputs.source_sha }}'"
            echo "result=fail" >> "$GITHUB_OUTPUT"; exit 1
          fi
          echo "result=pass" >> "$GITHUB_OUTPUT"

      - name: Write release receipt (durable record)
        # Only when a deploy actually happened. If an earlier step (e.g. token-assert) failed,
        # the deploy step is skipped, version_id is empty, and there is nothing to receipt —
        # skip cleanly instead of failing a second time on a missing --deployment-version-id.
        if: always() && steps.deploy.outputs.version_id != ''
        run: >-
          node scripts/release-control/frontend-release-control.mjs write-release-receipt
          --version dist/version.json
          --out release/frontend-release-receipt.json
          --source-sha "${{ steps.approved-source.outputs.source_sha }}"
          --run-id "${{ github.run_id }}"
          --actor "${{ github.actor }}"
          --target-route "fortress.silentshieldsecurity.com/*"
          --target-environment "production"
          --deployment-version-id "${{ steps.deploy.outputs.version_id }}"
          --rollback-version-id "${{ steps.predeploy.outputs.prev_version_id || 'none' }}"
          --served-verification-result "${{ steps.served.outputs.result || 'fail' }}"

      - name: Upload release receipt
        if: always() && steps.deploy.outputs.version_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-receipt
          path: |
            release/frontend-release-receipt.json
            dist/version.json
          retention-days: 90
