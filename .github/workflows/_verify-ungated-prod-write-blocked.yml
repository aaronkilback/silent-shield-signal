name: VERIFY — ungated prod write is blocked (gate 4 kill-proof)

# TEMPORARY, DISPATCH-ONLY verification for gate 4. Proves — from OUTSIDE the governed lane —
# that an ungated workflow CANNOT write the production worker, because the CF write token no
# longer exists at repo scope (it lives only in the `production`/`staging` environments).
#
# This job deliberately does NOT declare `environment: production`, so it can only read
# repo-level secrets (CLOUDFLARE_ACCOUNT_ID + the read-only Pages token). It then attempts a
# real `wrangler deploy` of the prod worker. Expected outcome: auth rejection.
#   - wrangler REJECTED on auth  -> route is shut  -> this job SUCCEEDS (the proof).
#   - wrangler ACCEPTED/deployed -> route is OPEN   -> this job FAILS LOUDLY (security hole).
#   - any OTHER failure (e.g. build) -> inconclusive -> this job FAILS (not a false pass).
#
# Delete this file immediately after capturing the result — a standing ungated deploy path is
# exactly what gate 4 closes.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  attempt-ungated-prod-write:
    name: Attempt ungated prod write (must be rejected)
    runs-on: ubuntu-latest
    # NOTE: intentionally NO `environment:` — this is the ungated attacker's-eye view.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Show what credentials an ungated job can actually see
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "UNEXPECTED: an ungated job CAN read CLOUDFLARE_API_TOKEN — repo-level token still exists."
          else
            echo "OK: ungated job cannot read CLOUDFLARE_API_TOKEN (empty at repo scope)."
          fi
          echo "account_id_present=$([ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && echo yes || echo no)"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install + build (so failure is auth, not missing dist)
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: "Attempt prod deploy from ungated context (expected: auth REJECTION)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          set +e
          npx wrangler deploy --name silent-shield-signal 2>&1 | tee wrangler.out
          rc=${PIPESTATUS[0]}
          set -e
          echo "---- wrangler exit code: $rc ----"
          if [ "$rc" -eq 0 ]; then
            echo "::error::SECURITY FAILURE — ungated prod deploy SUCCEEDED. The manual route is OPEN."
            exit 1
          fi
          if grep -qiE "CLOUDFLARE_API_TOKEN|must be logged in|not authenticated|authentication|unauthor|forbidden|\[code: *10000\]|non-interactive" wrangler.out; then
            echo "PROOF: ungated prod deploy was REJECTED on authentication. The route is shut."
            exit 0
          fi
          echo "::error::Ungated deploy failed, but NOT clearly on auth — inconclusive, inspect wrangler.out above."
          exit 1
