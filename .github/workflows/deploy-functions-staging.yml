name: Deploy Edge Functions (Staging)

# Staging counterpart of deploy-functions.yml. Same change-detection +
# deploy logic, but targets the staging Supabase project. Runs only when
# commits land on the `staging` branch.
#
# Required GitHub Secrets (operator must add after creating staging project):
#   STAGING_PROJECT_REF                  e.g. "abcdefghij..."
#   STAGING_VITE_SUPABASE_URL            https://<ref>.supabase.co
#   STAGING_SUPABASE_SERVICE_ROLE_KEY    new staging service-role key
# Reused (same operator access token works across projects):
#   SUPABASE_ACCESS_TOKEN
#
# PROVENANCE-REPAIR (deployment-control): the change detection now fails CLOSED.
# Previously a shallow checkout (fetch-depth: 2) could leave `github.event.before`
# unresolvable; the diff then failed, `|| true` swallowed the error, the function
# set became empty, and the job exited 0 reporting "No functions to deploy" while
# deploying nothing. Fixes: full history; resolvable-base + diff-success are
# REQUIRED (never converted to a no-op); an empty set is only a legitimate no-op
# when the diff actually succeeded with zero function/config changes; explicit
# dispatch targets are validated and asserted to have been deployed.

on:
  push:
    branches: [staging]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions-staging.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Function name (e.g. "alert-delivery"), "all", or blank for changed-only'
        required: false
        default: ''

concurrency:
  group: deploy-functions-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-functions:
    name: Deploy Edge Functions (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: the change-detection diff needs the base commit

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determine functions to deploy
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          TARGET_INPUT: ${{ github.event.inputs.target }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          list_all_functions() {
            find supabase/functions -mindepth 1 -maxdepth 1 -type d \
              | awk -F/ '{print $NF}' | grep -v '^_' \
              | while read -r dir; do [[ -f "supabase/functions/$dir/index.ts" ]] && echo "$dir"; done \
              | sort
          }

          MODE=""; FUNCTIONS=""

          if [[ -n "${TARGET_INPUT}" ]]; then
            # ── explicit, auditable manual dispatch ──
            if [[ "${TARGET_INPUT}" == "all" ]]; then
              MODE="all"; FUNCTIONS="$(list_all_functions)"
            else
              MODE="manual"; FUNCTIONS="${TARGET_INPUT}"
              # defense-in-depth: safe charset ONLY (no shell metacharacters). TARGET_INPUT is read
              # from env and is NEVER interpolated into a command — it is validated, then a known-safe
              # function name from the resolved list is what gets passed to the deploy command.
              if [[ ! "${TARGET_INPUT}" =~ ^[a-z0-9-]+$ ]]; then
                echo "::error::Forced target '${TARGET_INPUT}' contains illegal characters (allowed: [a-z0-9-])."; exit 1
              fi
              # RECOVERY CONSTRAINT: the forced single-target dispatch is restricted to an allowlist.
              # Currently ONLY 'alert-delivery' (the deployment-control recovery). Reject anything else.
              # Relax this allowlist deliberately if another function ever needs a forced staging deploy.
              case "${TARGET_INPUT}" in
                alert-delivery) : ;;
                *) echo "::error::Forced dispatch target '${TARGET_INPUT}' is not permitted. Only 'alert-delivery' is allowed for this recovery."; exit 1 ;;
              esac
              RESOLVED_DIR="supabase/functions/${TARGET_INPUT}"
              if [[ ! -f "${RESOLVED_DIR}/index.ts" ]]; then
                echo "::error::Requested function '${TARGET_INPUT}' has no ${RESOLVED_DIR}/index.ts at ${AFTER_SHA}"; exit 1
              fi
              echo "Resolved function directory: ${RESOLVED_DIR}"
            fi
          else
            # ── push: changed-only. Base MUST be resolvable AND the diff MUST succeed. ──
            if [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
              echo "::error::Base commit (github.event.before) is empty/all-zeros (new branch / unknown). Refusing to guess — use workflow_dispatch with an explicit target."; exit 1
            fi
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "::error::Base commit ${BEFORE_SHA} not resolvable in checkout (history too shallow?). FAILING CLOSED rather than deploying nothing."; exit 1
            fi
            # NO '|| true' on the diff: a diff failure must FAIL the job, never fall back to empty.
            if ! CHANGED_RAW="$(git diff --name-only "${BEFORE_SHA}" "${AFTER_SHA}" -- supabase/functions/ supabase/config.toml)"; then
              echo "::error::git diff ${BEFORE_SHA}..${AFTER_SHA} failed. FAILING CLOSED (never 'no functions to deploy')."; exit 1
            fi
            CHANGED="$(printf '%s\n' "${CHANGED_RAW}" | awk -F/ '/^supabase\/functions\// {print $3}; /^supabase\/config\.toml$/ {print "_config_toml_"}' | sort -u | grep -v '^$' || true)"
            if printf '%s\n' "${CHANGED}" | grep -qE '^_shared$|^_config_toml_$'; then
              MODE="redeploy_all"; FUNCTIONS="$(list_all_functions)"
            else
              MODE="changed"; FUNCTIONS="$(printf '%s\n' "${CHANGED}" | grep -v '^_' || true)"
            fi
          fi

          # ── provenance: always emit resolved SHAs + function list ──
          {
            echo "### Deploy detection (staging)"
            echo "| field | value |"
            echo "|---|---|"
            echo "| event | ${EVENT_NAME} |"
            echo "| workflow_ref | ${WORKFLOW_REF:-${GIT_REF}} |"
            echo "| checkout_sha | ${AFTER_SHA} |"
            echo "| before | ${BEFORE_SHA:-n/a} |"
            echo "| requested_target | ${TARGET_INPUT:-<changed-only>} |"
            echo "| mode | ${MODE} |"
            echo "| functions | ${FUNCTIONS:-<none>} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "workflow_ref=${WORKFLOW_REF:-${GIT_REF}} checkout_sha=${AFTER_SHA} event=${EVENT_NAME} before=${BEFORE_SHA:-n/a} mode=${MODE} requested_target=${TARGET_INPUT:-<changed-only>}"
          echo "Functions to deploy: ${FUNCTIONS:-<none>}"

          # A legitimate no-op ONLY when the diff SUCCEEDED and genuinely changed no functions.
          if [[ -z "${FUNCTIONS}" ]]; then
            if [[ "${MODE}" == "changed" ]]; then
              echo "::notice::No function/config changes in ${BEFORE_SHA}..${AFTER_SHA} — nothing to deploy (legitimate no-op)."
              { echo "mode=noop"; echo "functions="; echo "requested="; } >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::error::Empty function set in mode='${MODE}' — failing closed."; exit 1
          fi

          {
            echo "mode=${MODE}"
            echo "requested=${TARGET_INPUT}"
            echo "functions<<EOF"; echo "${FUNCTIONS}"; echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Source provenance (subtree hashes of functions to deploy)
        if: steps.detect.outputs.mode != 'noop'
        run: |
          set -euo pipefail
          echo "### Source subtree hashes (pre-deploy)" >> "${GITHUB_STEP_SUMMARY}"
          echo "| function | tree-hash |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|---|---|" >> "${GITHUB_STEP_SUMMARY}"
          while IFS= read -r fn; do
            [[ -z "$fn" ]] && continue
            h="$(git rev-parse "HEAD:supabase/functions/${fn}" 2>/dev/null || echo 'n/a')"
            echo "subtree ${fn}: ${h} @ HEAD ${GITHUB_SHA}"
            echo "| ${fn} | ${h} |" >> "${GITHUB_STEP_SUMMARY}"
          done <<< "${{ steps.detect.outputs.functions }}"

      - name: Deploy to staging
        if: steps.detect.outputs.mode != 'noop'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
          REQUESTED: ${{ steps.detect.outputs.requested }}
        run: |
          set -euo pipefail
          if [[ -z "${PROJECT_REF}" ]]; then
            echo "::error::STAGING_PROJECT_REF secret is not set."; exit 1
          fi
          mapfile -t WANT < <(printf '%s\n' "${{ steps.detect.outputs.functions }}" | grep -v '^$')
          if [[ ${#WANT[@]} -eq 0 ]]; then
            echo "::error::mode is not noop but the resolved function list is empty — failing closed."; exit 1
          fi
          FAILED=(); DEPLOYED=()
          for fn in "${WANT[@]}"; do
            echo "::group::Deploy ${fn} (staging)"
            # exact command logged with the project ref MASKED (the fn is a validated, known-safe name)
            echo "exact deploy command: supabase functions deploy ${fn} --project-ref ***"
            if supabase functions deploy "${fn}" --project-ref "${PROJECT_REF}"; then
              DEPLOYED+=("${fn}")
            else
              FAILED+=("${fn}"); echo "::error title=Staging deploy failed::${fn}"
            fi
            echo "::endgroup::"
          done
          echo "─── Summary (staging) ───"
          printf 'Requested: %s\n' "${WANT[*]}"
          printf 'Deployed:  %s\n' "${DEPLOYED[*]:-<none>}"
          printf 'Failed:    %s\n' "${FAILED[*]:-<none>}"
          {
            echo "### Deploy result (staging)"
            echo "- requested: ${WANT[*]}"
            echo "- deployed: ${DEPLOYED[*]:-<none>}"
            echo "- failed: ${FAILED[*]:-<none>}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ ${#FAILED[@]} -gt 0 ]]; then exit 1; fi
          # Fail if any requested function was NOT actually passed-to/accepted-by the deploy command.
          for fn in "${WANT[@]}"; do
            if ! printf '%s\n' "${DEPLOYED[@]}" | grep -qx "${fn}"; then
              echo "::error::Requested function '${fn}' was not deployed."; exit 1
            fi
          done
          # Extra guard for explicit dispatch: the requested target must be in the deployed set.
          if [[ -n "${REQUESTED}" && "${REQUESTED}" != "all" ]]; then
            if ! printf '%s\n' "${DEPLOYED[@]}" | grep -qx "${REQUESTED}"; then
              echo "::error::Explicitly requested target '${REQUESTED}' was not deployed."; exit 1
            fi
          fi

  benchmark-regression-check-staging:
    name: Post-deploy benchmark (staging)
    needs: deploy-functions
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && needs.deploy-functions.result == 'success'
    env:
      SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
      SERVICE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Guard — require staging secrets
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SERVICE_KEY" ]]; then
            echo "::error::Missing STAGING_VITE_SUPABASE_URL or STAGING_SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

      - name: Trigger run-benchmark on staging
        run: |
          set -euo pipefail
          echo "Triggering benchmark on staging for commit ${COMMIT_SHA:0:8}"
          curl -sS --max-time 30 -X POST \
            -H "Authorization: Bearer ${SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            "${SUPABASE_URL}/functions/v1/run-benchmark" \
            -d "{\"triggered_by\":\"ci_staging:${COMMIT_SHA:0:8}\"}"

      - name: Poll + compare
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            sleep 10
            ROW=$(curl -sS "${SUPABASE_URL}/rest/v1/benchmark_runs?triggered_by=eq.ci_staging:${COMMIT_SHA:0:8}&order=triggered_at.desc&limit=1" \
              -H "apikey: ${SERVICE_KEY}" -H "Authorization: Bearer ${SERVICE_KEY}")
            COMPLETED=$(echo "$ROW" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('completed_at') if d else 'none')")
            if [[ "$COMPLETED" != "None" && "$COMPLETED" != "none" && -n "$COMPLETED" ]]; then
              echo "$ROW" > /tmp/run.json
              break
            fi
          done
          if [[ ! -f /tmp/run.json ]]; then
            echo "::error::Staging benchmark did not complete in 8 minutes"
            exit 1
          fi
          NEW_ACC=$(python3 -c "import json; d=json.load(open('/tmp/run.json')); print(d[0].get('signal_creation_accuracy') or 0)")
          PREV=$(curl -sS "${SUPABASE_URL}/rest/v1/benchmark_runs?triggered_by=like.ci_staging:*&order=triggered_at.desc&offset=1&limit=1&select=signal_creation_accuracy" \
            -H "apikey: ${SERVICE_KEY}" -H "Authorization: Bearer ${SERVICE_KEY}")
          PREV_ACC=$(echo "$PREV" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('signal_creation_accuracy') if d else None)")
          if [[ "$PREV_ACC" == "None" || -z "$PREV_ACC" ]]; then
            echo "::notice::Staging baseline established: accuracy=${NEW_ACC}"
            exit 0
          fi
          python3 - <<PY
          new = float("${NEW_ACC}"); prev = float("${PREV_ACC}"); drop = prev - new
          print(f"STAGING NEW={new:.4f} PREV={prev:.4f} DROP={drop:+.4f}")
          if drop > 0.05:
              print(f"::error::Staging regression: drop {drop:.4f} > 0.05. DO NOT promote this commit to main.")
              import sys; sys.exit(1)
          print(f"::notice::Staging benchmark OK ({new:.2%}, {(-drop):+.2%} vs previous)")
          PY
