name: Deploy Frontend (Cloudflare Worker)

on:
  workflow_dispatch:
    inputs:
      approved_commit_sha:
        description: Exact main commit SHA approved for production frontend release.
        required: true
        type: string
      confirm_frontend_release:
        description: Type RELEASE_FRONTEND_PRODUCTION to confirm the production release.
        required: true
        type: string
      rollback_version_id:
        description: Cloudflare Worker version ID currently serving production and approved as the rollback pointer.
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Governed Production Frontend Release
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.confirm_frontend_release == 'RELEASE_FRONTEND_PRODUCTION'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify approved main commit
        id: approved-source
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "${{ inputs.approved_commit_sha }}" ]; then
            echo "Approved SHA does not match checked-out main."
            echo "approved=${{ inputs.approved_commit_sha }}"
            echo "head=$HEAD_SHA"
            exit 1
          fi
          echo "source_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Require exact CI success
        uses: actions/github-script@v7
        env:
          APPROVED_SHA: ${{ steps.approved-source.outputs.source_sha }}
        with:
          script: |
            const requiredSuccess = [
              'TypeScript & Build',
              'ESLint',
              'Critical File Guard',
              'Shared Imports Consistency (_shared/*)',
              'Workstream D — confidence + provenance suite',
              'Workstream D — no autonomous execution on score',
              'Playwright E2E',
              'Unit Tests (Vitest)',
              'a1-guard',
            ];

            const allowedSkipped = [
              'Live Production Reads — Manual Only / Loop Activity',
              'Live Production Reads — Manual Only / Cron Alignment',
              'Live Production Reads — Manual Only / DB Types Drift',
              'Live Operational Checks — Manual Only / Health Gate',
              'Live Operational Checks — Manual Only / Pipeline Smoke',
            ];

            const sha = process.env.APPROVED_SHA;
            const runs = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              per_page: 100,
            });

            const latestByName = new Map();
            for (const run of runs) {
              const existing = latestByName.get(run.name);
              if (!existing || Date.parse(run.started_at || run.created_at) > Date.parse(existing.started_at || existing.created_at)) {
                latestByName.set(run.name, run);
              }
            }

            const failures = [];
            for (const name of requiredSuccess) {
              const run = latestByName.get(name);
              if (!run) {
                failures.push(`${name}: missing`);
              } else if (run.status !== 'completed' || run.conclusion !== 'success') {
                failures.push(`${name}: status=${run.status} conclusion=${run.conclusion}`);
              }
            }

            for (const name of allowedSkipped) {
              const run = latestByName.get(name);
              if (!run) {
                failures.push(`${name}: missing`);
              } else if (run.status !== 'completed' || run.conclusion !== 'skipped') {
                failures.push(`${name}: expected skipped, status=${run.status} conclusion=${run.conclusion}`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(`Frontend release blocked by CI evidence for ${sha}:\n${failures.join('\n')}`);
            } else {
              core.info(`Frontend release CI evidence passed for ${sha}`);
            }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Write served version artifact
        run: >-
          node scripts/release-control/frontend-release-control.mjs write-version
          --dist dist
          --source-sha "${{ steps.approved-source.outputs.source_sha }}"
          --run-id "${{ github.run_id }}"
          --target-route "fortress.silentshieldsecurity.com/*"
          --target-environment "production"

      - name: Deploy to Cloudflare Workers
        id: deploy-cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Write frontend release receipt
        run: >-
          node scripts/release-control/frontend-release-control.mjs write-receipt
          --version dist/version.json
          --out release/frontend-production-release-receipt.json
          --source-sha "${{ steps.approved-source.outputs.source_sha }}"
          --run-id "${{ github.run_id }}"
          --actor "${{ github.actor }}"
          --target-route "fortress.silentshieldsecurity.com/*"
          --target-environment "production"
          --deployment-version-id "${{ steps.deploy-cloudflare.outputs.deployment-id }}"
          --rollback-version-id "${{ inputs.rollback_version_id }}"
          --served-verification-result "not_run"

      - name: Upload frontend release receipt
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-release-receipt
          path: |
            release/frontend-production-release-receipt.json
            dist/version.json
          retention-days: 30
