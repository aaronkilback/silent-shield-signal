name: Fortress CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Privileged operational checks (health-gate, pipeline-smoke) run ONLY via
  # deliberate manual dispatch with the exact confirmation value below. They are
  # never an automatic consequence of a source push/merge to main. See the
  # "Live operational checks" boundary note above those jobs.
  workflow_dispatch:
    inputs:
      confirm_live_operational_checks:
        description: >-
          Type RUN_LIVE_SYSTEM_OPS to run the privileged, potentially MUTATING
          live system-ops checks (health-check + pipeline-tests). Leave blank for
          ordinary CI — the privileged jobs stay skipped unless this exact value
          is supplied.
        required: false
        default: ''
        type: string
      confirm_live_production_reads:
        description: >-
          Type RUN_LIVE_PRODUCTION_READS to run privileged production-facing
          read checks (loop activity, cron alignment, DB types drift). Leave
          blank for ordinary CI — these live-read jobs stay skipped unless this
          exact value is supplied.
        required: false
        default: ''
        type: string

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  build:
    name: TypeScript & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx eslint src/ --max-warnings 999

  guard:
    name: Critical File Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify watchdog + health hooks exist
        run: |
          for f in src/hooks/useFortressHealth.ts src/hooks/useSystemHealth.tsx src/hooks/useSystemTestRun.ts src/hooks/useReliability.ts src/hooks/useSignalQuality.ts src/hooks/useErrorNotifications.tsx src/hooks/useAuth.tsx src/hooks/useTenant.tsx src/lib/testing/systemTestRunManager.ts src/lib/testing/e2eTests.ts; do
            if [ ! -f "$f" ]; then
              echo "CRITICAL FILE MISSING: $f"
              exit 1
            fi
            echo "OK $f"
          done
      # Legacy Supabase JWT service keys are base64-encoded — "service_role" never appears as plaintext; this guard covers sb_secret_* keys + the SUPABASE_SERVICE_ROLE_KEY env-var name only, not hardcoded legacy JWTs.
      - name: No service_role key in frontend
        run: |
          # (1) Real leak vectors — a hardcoded secret key or the env key name:
          if grep -rnE "sb_secret_[A-Za-z0-9]|SUPABASE_SERVICE_ROLE_KEY" src/hooks/ src/contexts/ src/lib/ 2>/dev/null; then
            echo "service_role KEY found in frontend"; exit 1
          fi
          # (2) Bare "service_role" word, EXCLUDING TS string-union type members and
          #     comments (legit role names, e.g. SignalAccessRole). Comment detection
          #     is anchored to the start of line CONTENT (after grep -n's "file:line:"
          #     prefix) so an inline URL (https://) is not misread as a comment.
          HITS=$(grep -rn "service_role" src/hooks/ src/contexts/ src/lib/ 2>/dev/null \
                 | grep -vE "['\"]service_role['\"]" \
                 | grep -vE ":[0-9]+:[[:space:]]*(//|\*|/\*)" || true)
          if [ -n "$HITS" ]; then
            echo "Unexpected service_role reference in frontend:"; echo "$HITS"; exit 1
          fi
          echo "No service_role leak"
      - name: No vip_id references
        run: |
          COUNT=$(grep -r "vip_id" src/ --include="*.ts" --include="*.tsx" 2>/dev/null | wc -l)
          [ "$COUNT" -gt "0" ] && echo "WARNING: $COUNT vip_id references found"
          exit 0

  shared-imports:
    name: Shared Imports Consistency (_shared/*)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify every import from supabase/functions/_shared/* resolves to a real export
        run: node scripts/check-shared-imports.mjs

  workstream-d-tests:
    name: Workstream D — confidence + provenance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Run Deno test suite (evaluator · framing · prose-lint)
        run: deno test --allow-none --no-check supabase/functions/_shared/aegis-confidence.test.ts

  no-auto-exec-on-score:
    name: Workstream D — no autonomous execution on score
    runs-on: ubuntu-latest
    # AUDIT-ONLY (per feedback_audit_before_blocking_ci policy). The script
    # exits 0 even when violations are found unless --strict is passed.
    # Promote to --strict in a follow-on PR after the audit run is clean.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static check — recommendation/approval/execution separation
        run: node scripts/check-no-autonomous-execution-on-score.mjs

  cron-alignment:
    name: 'Live Production Reads — Manual Only / Cron Alignment'
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.confirm_live_production_reads == 'RUN_LIVE_PRODUCTION_READS'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate cron alignment (static + live drift)
        run: node scripts/validate-cron-alignment.mjs
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: kpuqukppbmwebiptqmog

  db-types-drift:
    name: 'Live Production Reads — Manual Only / DB Types Drift'
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.confirm_live_production_reads == 'RUN_LIVE_PRODUCTION_READS'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify committed types.ts matches live schema
        run: node scripts/gen-db-types.mjs --check
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: kpuqukppbmwebiptqmog

  # ────────────────────────────────────────────────────────────────────────
  # PRIVILEGED OPERATIONAL CHECKS — health-gate + pipeline-smoke
  #
  # Live operational checks are deliberately privileged and potentially
  # mutating. They are not permitted as an automatic consequence of a source
  # merge. (health-check writes audit_events, updates stuck documents, and
  # enqueues retries; pipeline-tests creates/deletes signals, writes pipeline
  # test results, and invokes downstream privileged functions.)
  #
  # They run ONLY via manual `workflow_dispatch` with the exact confirmation
  # input `confirm_live_operational_checks: RUN_LIVE_SYSTEM_OPS`. A push or
  # pull_request to main will NOT run them.
  # ────────────────────────────────────────────────────────────────────────
  health-gate:
    name: 'Live Operational Checks — Manual Only / Health Gate'
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.confirm_live_operational_checks == 'RUN_LIVE_SYSTEM_OPS'
    steps:
      - name: Query system-ops health-check
        run: |
          RESPONSE=$(curl -s --max-time 30 -X POST -H "Content-Type: application/json" -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/system-ops" -d '{"action":"health-check"}')
          echo "Response: $RESPONSE"
          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('overall_status','unknown'))" 2>/dev/null || echo "unknown")
          echo "Status: $STATUS"
          [ "$STATUS" = "unhealthy" ] && echo "WARNING: platform unhealthy" && exit 0
          echo "Health gate passed"

  loop-health:
    name: 'Live Production Reads — Manual Only / Loop Activity'
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.confirm_live_production_reads == 'RUN_LIVE_PRODUCTION_READS'
    steps:
      - name: Check loop activity via Supabase
        run: |
          URL="${{ secrets.VITE_SUPABASE_URL }}"
          # 2026-05-19: PostgREST with new sb_* keys needs separate
          # apikey (publishable) + Authorization (secret) — the legacy
          # JWT pattern of "same key in both headers" returned empty
          # arrays via RLS filtering, making every loop look idle.
          ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          NOW_MINUS_24H=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)
          NOW_MINUS_1H=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-1H +%Y-%m-%dT%H:%M:%SZ)
          check() { curl -s -H "apikey: $ANON_KEY" -H "Authorization: Bearer $KEY" "$URL/rest/v1/$1?select=id&$2=gte.$NOW_MINUS_24H&limit=1" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else 0)" 2>/dev/null || echo 0; }
          
          W=$(check watchdog_learnings created_at)
          O=$(check autonomous_actions_log created_at)
          A=$(check ai_assistant_messages created_at)
          S=$(check autonomous_scan_results created_at)
          echo "Loops (24h): watchdog=$W ooda=$O aegis=$A scans=$S"
          IDLE=0
          [ "$W" = "0" ] && IDLE=$((IDLE+1))
          [ "$O" = "0" ] && IDLE=$((IDLE+1))
          [ "$A" = "0" ] && IDLE=$((IDLE+1))
          [ "$S" = "0" ] && IDLE=$((IDLE+1))
          [ "$IDLE" -ge "3" ] && echo "ERROR: 3+ autonomous loops idle - check cron jobs" && exit 1
          echo "OK: Core loops active"

      - name: Check for stuck document processing
        run: |
          URL="${{ secrets.VITE_SUPABASE_URL }}"
          # Same apikey/Authorization split required by new sb_* keys.
          ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          NOW_MINUS_30M=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-30M +%Y-%m-%dT%H:%M:%SZ)
          # Check for documents stuck in pending/processing for >30 min
          STUCK=$(curl -s -H "apikey: $ANON_KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/documents?select=id&processing_status=in.(pending,processing)&created_at=lte.$NOW_MINUS_30M&limit=1" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else 0)" 2>/dev/null || echo 0)
          # Also check error rate: documents failed in last hour
          FAILED=$(curl -s -H "apikey: $ANON_KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/documents?select=id&processing_status=eq.failed&updated_at=gte.$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo $NOW_MINUS_30M)&limit=50" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else 0)" 2>/dev/null || echo 0)
          echo "Document pipeline: stuck=$STUCK failed_1h=$FAILED"
          [ "$STUCK" -gt "5" ] && echo "WARNING: $STUCK documents stuck in processing" && exit 1
          [ "$FAILED" -gt "20" ] && echo "WARNING: $FAILED document failures in last hour" && exit 1
          echo "OK: Document pipeline healthy"

      - name: Check mapbox token configured
        run: |
          MAPBOX_TOKEN="${{ secrets.VITE_MAPBOX_TOKEN }}"
          if [ -z "$MAPBOX_TOKEN" ] || [ "$MAPBOX_TOKEN" = "your_mapbox_token_here" ]; then
            echo "WARNING: VITE_MAPBOX_TOKEN is not configured - travel/incident maps will be blank"
            echo "Add a valid Mapbox public token at https://account.mapbox.com/access-tokens/"
            echo "    Get token: https://account.mapbox.com/access-tokens/"
          fi

  pipeline-smoke:
    name: 'Live Operational Checks — Manual Only / Pipeline Smoke'
    runs-on: ubuntu-latest
    needs: build
    # Privileged/mutating: creates+deletes signals, writes pipeline test results,
    # invokes downstream privileged functions. Manual dispatch + confirmation only.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.confirm_live_operational_checks == 'RUN_LIVE_SYSTEM_OPS'
    steps:
      - name: Trigger pipeline tests
        run: |
          RESPONSE=$(curl -s --max-time 120 -X POST -H "Content-Type: application/json" -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/system-ops" -d '{"action":"pipeline-tests"}')
          echo "$RESPONSE" | python3 -c "
          import sys,json
          try:
            d=json.load(sys.stdin)
            r=d.get('results',[])
            p=sum(1 for x in r if x.get('status')=='pass')
            f=sum(1 for x in r if x.get('status')=='fail')
            print(f'Passed: {p}  Failed: {f}  Total: {len(r)}')
            [print(('OK' if x.get('status')=='pass' else 'FAIL')+' '+x.get('test_name','?')) for x in r]
            sys.exit(1) if f>0 else None
          except Exception as e: print('parse error:',e)
          " 2>&1 || echo "Pipeline errors - check logs"

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          # E2E authenticates + renders against STAGING (aegis-staging + staging
          # Supabase), never prod. TEST_USER_* = the staging _aegis_test_super
          # account; VITE_SUPABASE_* point at the staging project so the auth
          # fixture's password grant hits the project where that user lives. (#57)
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Run Vitest unit tests
        run: npm test
        env:
          CI: true
          # Inputs for the tenant-isolation invariant test
          # (src/test/security/tenant-isolation.invariant.test.ts).
          # The test FAILS LOUDLY if any of these are missing in CI —
          # this is a load-bearing security gate, not an optional test.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TEST_INVARIANT_USER_A_EMAIL: ${{ secrets.TEST_INVARIANT_USER_A_EMAIL }}
          TEST_INVARIANT_USER_A_PASSWORD: ${{ secrets.TEST_INVARIANT_USER_A_PASSWORD }}
          TEST_INVARIANT_USER_B_EMAIL: ${{ secrets.TEST_INVARIANT_USER_B_EMAIL }}
          TEST_INVARIANT_USER_B_PASSWORD: ${{ secrets.TEST_INVARIANT_USER_B_PASSWORD }}
