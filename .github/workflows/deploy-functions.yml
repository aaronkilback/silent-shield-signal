name: Deploy Edge Functions

# Detects which function directories changed in the push and deploys each
# one. If the shared module (_shared/) changed, deploys ALL functions
# because the shared code is bundled into each function at deploy time
# (so a fix in _shared/ai-gateway.ts only takes effect for a function
# the next time that function is itself redeployed).
#
# Replaces the original workflow which only ever deployed
# agent-activity-scanner — explaining several weeks of CI showing green
# while the live functions ran stale code (May 9 2026 root-cause).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Function name, "all", or blank for changed-only'
        required: false
        default: ''

concurrency:
  # Serialize deploys per branch so two pushes can't race the CLI auth.
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Need previous commit to diff against for changed-only mode.
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determine functions to deploy
        id: detect
        run: |
          set -euo pipefail
          MODE="changed"
          TARGET_INPUT='${{ github.event.inputs.target }}'

          list_all_functions() {
            # Every directory under supabase/functions/ that contains an
            # index.ts (the deployable entrypoint), except those starting
            # with `_` (shared modules) — the CLI deploy fails on dirs that
            # only contain test files (e.g. anti-hallucination-test/ which
            # only has index.test.ts).
            find supabase/functions -mindepth 1 -maxdepth 1 -type d \
              | awk -F/ '{print $NF}' \
              | grep -v '^_' \
              | while read -r dir; do
                  if [[ -f "supabase/functions/$dir/index.ts" ]]; then
                    echo "$dir"
                  fi
                done \
              | sort
          }

          if [[ -n "$TARGET_INPUT" ]]; then
            if [[ "$TARGET_INPUT" == "all" ]]; then
              MODE="all"
              FUNCTIONS=$(list_all_functions)
            else
              MODE="manual"
              FUNCTIONS="$TARGET_INPUT"
            fi
          else
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/functions/ supabase/config.toml \
              | awk -F/ '/^supabase\/functions\// {print $3}; /^supabase\/config\.toml$/ {print "_config_toml_"}' \
              | sort -u \
              | grep -v '^$' || true)

            if echo "$CHANGED" | grep -qE '^_shared$|^_config_toml_$'; then
              # _shared/ change → bundled into every function, redeploy all.
              # config.toml change → verify_jwt or other per-function settings
              # may have moved; redeploy all to keep deployed state in sync.
              MODE="redeploy_all"
              FUNCTIONS=$(list_all_functions)
            else
              FUNCTIONS=$(echo "$CHANGED" | grep -v '^_' || true)
            fi
          fi

          if [[ -z "$FUNCTIONS" ]]; then
            echo "No functions to deploy."
            echo "mode=noop" >> "$GITHUB_OUTPUT"
            echo "functions=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub Actions can't pass multi-line values through outputs the
          # naive way; use a heredoc-style delimiter.
          {
            echo "mode=$MODE"
            echo "functions<<EOF"
            echo "$FUNCTIONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Mode: $MODE"
          echo "Functions to deploy:"
          echo "$FUNCTIONS"

      - name: Diagnose CLI + auth
        if: steps.detect.outputs.mode != 'noop'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: kpuqukppbmwebiptqmog
        run: |
          echo "=== which supabase ==="
          which supabase || echo "NOT IN PATH"
          echo "=== supabase --version ==="
          supabase --version || echo "VERSION CMD FAILED"
          echo "=== access token set? ==="
          if [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "yes (length=${#SUPABASE_ACCESS_TOKEN})"
          else
            echo "NO — secret missing"
          fi
          echo "=== smoke test: deploy a single fn (verbose) ==="
          # Pick the smallest, simplest function to test auth + CLI.
          # If THIS fails, everything below in the loop will fail too.
          # All output (stderr included) inline so we can see the error.
          supabase functions deploy academy-build-training --project-ref "$PROJECT_REF" || {
            echo "=== smoke test failed (exit $?) — see stderr above ==="
            exit 1
          }
          echo "=== smoke test passed ==="

      - name: Deploy
        if: steps.detect.outputs.mode != 'noop'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: kpuqukppbmwebiptqmog
        run: |
          # Don't fail-fast: a single function deploy failure shouldn't
          # block the rest. Track failures and exit non-zero at the end so
          # the workflow run is red and the operator notices.
          FAILED=()
          DEPLOYED=()

          while IFS= read -r fn; do
            [[ -z "$fn" ]] && continue
            echo "::group::Deploy $fn"
            # Print the actual command + capture output without redirecting
            # so stderr lands in the log. The `if` form swallows output
            # quietly when the command succeeds, which is what we want for
            # the bulk run (~300 fns).
            if supabase functions deploy "$fn" --project-ref "$PROJECT_REF"; then
              DEPLOYED+=("$fn")
              echo "::endgroup::"
            else
              echo "(see stderr above)"
              FAILED+=("$fn")
              echo "::endgroup::"
              echo "::error title=Deploy failed::$fn"
            fi
          done <<< "${{ steps.detect.outputs.functions }}"

          echo ""
          echo "─── Summary ─────────────────────────────────────────"
          echo "Deployed: ${#DEPLOYED[@]}"
          echo "Failed:   ${#FAILED[@]}"
          if [ ${#FAILED[@]} -gt 0 ]; then
            printf '  - %s\n' "${FAILED[@]}"
            exit 1
          fi

  # F-012 (2026-05-13): Auto-regression check via the labeled benchmark.
  # Runs after deploys land. If decision accuracy drops more than 5 points
  # vs. the previous CI-triggered run, this job FAILS — the deploy is
  # already live but the regression is loudly visible. Operator can revert.
  # Setting this up first because every other audit fix's safety claim
  # depends on it.
  benchmark-regression-check:
    name: Post-deploy benchmark
    needs: deploy-functions
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-functions.result == 'success'
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Trigger run-benchmark
        id: trigger
        run: |
          set -euo pipefail
          echo "Triggering benchmark for commit ${COMMIT_SHA:0:8}"
          # run-benchmark accepts triggered_by; tag with the SHA so we
          # can correlate runs to deploys later.
          RESPONSE=$(curl -sS --max-time 30 -X POST \
            -H "Authorization: Bearer ${SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            "${SUPABASE_URL}/functions/v1/run-benchmark" \
            -d "{\"triggered_by\":\"ci_deploy:${COMMIT_SHA:0:8}\"}")
          echo "Initial response: $RESPONSE"
          # The function inserts the run row itself; we just need to wait.

      - name: Poll for completion
        id: poll
        run: |
          set -euo pipefail
          # Most runs complete in 2-3 minutes; poll up to 8 minutes.
          for i in $(seq 1 48); do
            sleep 10
            ROW=$(curl -sS "${SUPABASE_URL}/rest/v1/benchmark_runs?triggered_by=eq.ci_deploy:${COMMIT_SHA:0:8}&order=triggered_at.desc&limit=1" \
              -H "apikey: ${SERVICE_KEY}" -H "Authorization: Bearer ${SERVICE_KEY}")
            COMPLETED=$(echo "$ROW" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('completed_at') if d else 'none')")
            if [[ "$COMPLETED" != "None" && "$COMPLETED" != "none" && -n "$COMPLETED" ]]; then
              echo "Run completed at $COMPLETED"
              echo "$ROW" > /tmp/run.json
              break
            fi
            echo "[$i/48] still running…"
          done
          if [[ ! -f /tmp/run.json ]]; then
            echo "::error::Benchmark did not complete within 8 minutes"
            exit 1
          fi

      - name: Compare against previous green run
        run: |
          set -euo pipefail
          NEW_ACC=$(python3 -c "import json; d=json.load(open('/tmp/run.json')); print(d[0].get('signal_creation_accuracy') or 0)")
          NEW_PASS=$(python3 -c "import json; d=json.load(open('/tmp/run.json')); print(d[0].get('examples_passed') or 0)")
          NEW_FAIL=$(python3 -c "import json; d=json.load(open('/tmp/run.json')); print(d[0].get('examples_failed') or 0)")
          echo "This run: accuracy=${NEW_ACC} passed=${NEW_PASS} failed=${NEW_FAIL}"

          # Previous CI-deploy run (offset 1 = the one before this)
          PREV=$(curl -sS "${SUPABASE_URL}/rest/v1/benchmark_runs?triggered_by=like.ci_deploy:*&order=triggered_at.desc&offset=1&limit=1&select=signal_creation_accuracy,examples_passed,triggered_at" \
            -H "apikey: ${SERVICE_KEY}" -H "Authorization: Bearer ${SERVICE_KEY}")
          PREV_ACC=$(echo "$PREV" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('signal_creation_accuracy') if d else None)")

          if [[ "$PREV_ACC" == "None" || -z "$PREV_ACC" ]]; then
            echo "No previous CI benchmark run found. Establishing baseline."
            echo "::notice::Baseline established: accuracy=${NEW_ACC}"
            exit 0
          fi

          echo "Previous CI run: accuracy=${PREV_ACC}"

          # Fail if drop >5 percentage points (0.05).
          # Improvements always pass. Equal-or-better passes.
          python3 - <<PY
          new = float("${NEW_ACC}")
          prev = float("${PREV_ACC}")
          drop = prev - new
          print(f"NEW={new:.4f}  PREV={prev:.4f}  DROP={drop:+.4f}")
          if drop > 0.05:
              print(f"::error::Benchmark regression: accuracy dropped {drop:.4f} (>0.05 threshold)")
              print(f"::error::This deploy degraded signal_creation_accuracy from {prev:.2%} to {new:.2%}.")
              print(f"::error::Revert commit ${COMMIT_SHA:0:8} or investigate before next deploy.")
              import sys; sys.exit(1)
          print(f"::notice::Benchmark OK ({new:.2%}, change {(-drop):+.2%} vs previous)")
          PY
