name: Frontend Staging Preflight (No Deploy)

# Staging frontend release-control containment. This workflow intentionally
# does not deploy, invoke provider tooling, or reference deployment credentials.

on:
  workflow_dispatch:
    inputs:
      approved_commit_sha:
        description: Exact staging commit SHA approved for staging frontend preflight.
        required: true
        type: string
      confirm_staging_preflight:
        description: Type RUN_STAGING_FRONTEND_PREFLIGHT to run the non-deploy staging frontend preflight.
        required: true
        type: string

jobs:
  preflight:
    name: Staging Frontend Preflight — No Deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/staging' &&
      github.event.inputs.confirm_staging_preflight == 'RUN_STAGING_FRONTEND_PREFLIGHT'
    env:
      VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Verify approved staging commit
        id: approved-source
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "${{ inputs.approved_commit_sha }}" ]; then
            echo "Approved SHA does not match checked-out staging."
            echo "approved=${{ inputs.approved_commit_sha }}"
            echo "head=$HEAD_SHA"
            exit 1
          fi
          echo "source_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Guard — require staging Vite variables
        run: |
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Missing STAGING_VITE_SUPABASE_URL or STAGING_VITE_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build staging artifact only
        run: npm run build

      - name: Write staging frontend preflight evidence
        run: node scripts/release-control/staging-frontend-preflight.mjs
        env:
          PREFLIGHT_SOURCE_COMMIT_SHA: ${{ steps.approved-source.outputs.source_sha }}
          PREFLIGHT_GITHUB_RUN_ID: ${{ github.run_id }}
          PREFLIGHT_ACTOR: ${{ github.actor }}

      - name: Upload staging frontend preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-frontend-preflight-artifact
          path: |
            release/staging-frontend-preflight-record.json
            dist/version.json
            dist/
          retention-days: 7
