name = "silent-shield-signal"
compatibility_date = "2025-01-01"
routes = [
  { pattern = "fortress.silentshieldsecurity.com/*", zone_name = "silentshieldsecurity.com" }
]

# No [build] command for the prod worker: the governed workflow
# (.github/workflows/deploy-frontend-production.yml) is the SINGLE build authority. It
# runs `npm run build`, then stamps version.json into dist/, then `wrangler deploy`.
# A wrangler [build] here re-runs Vite — and Vite's emptyOutDir wipes dist/, destroying
# the stamped version.json BEFORE upload, so /version.json served the SPA fallback and
# "what's running in prod" was unprovable. Root-caused + removed 2026-08-27.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Staging environment — separate worker bound to a staging subdomain.
# Deploy via: wrangler deploy --env staging
# Build step injects different Vite env vars (VITE_SUPABASE_URL pointing
# at the staging Supabase project) via the deploy-frontend-staging
# workflow's env block.
[env.staging]
name = "silent-shield-signal-staging"
routes = [
  { pattern = "aegis-staging.silentshieldsecurity.com/*", zone_name = "silentshieldsecurity.com" }
]

[env.staging.build]
command = "npm install && npm run build"

[env.staging.assets]
directory = "./dist"
not_found_handling = "single-page-application"
